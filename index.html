<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小學互動教室</title>
<meta name="theme-color" content="#fff8e7">
<link rel="icon" href="/icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<!-- 樣式在 src/styles/（由 src/main.js 載入）。 -->
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn hidden" id="homeBtn" title="回首頁" aria-label="回首頁"></button>
    <h1>📏 小學互動教室</h1>
    <button class="iconbtn" id="mute" title="朗讀開關" aria-label="朗讀開關" aria-pressed="true"></button>
    <button class="iconbtn" id="sfxBtn" title="音效開關" aria-label="音效開關" aria-pressed="true"></button>
    <button class="iconbtn hidden" id="profileBtn" title="孩子檔案" aria-label="孩子檔案"></button>
  </header>

  <!-- 首頁、年級、學期、孩子檔案畫面：由 src/platform/views/ 繪製在這裡 -->
  <section id="home"></section>

  <!-- LESSON / PRACTICE -->
  <section id="lesson" class="hidden">
    <div id="crumb"></div>
    <div id="sceneTitle"><span id="stTxt"></span><span id="score"></span></div>
    <div id="stage">
      <svg id="svg" viewBox="0 0 800 420"></svg>
      <div class="overlay hidden" id="startOv">
        <div style="font-size:60px">🔊</div>
        <div style="font-size:clamp(22px,4vw,32px);font-weight:900;margin:8px 0 18px">打開喇叭，準備開始！</div>
        <button class="bigbtn pulse" id="startBtn" style="background:var(--green)">▶ 開始</button>
      </div>
    </div>
    <!-- 字幕列：左邊是吉祥物小熊（src/engine/mascot.js），只是裝飾，不擋點擊 -->
    <div id="subRow">
      <div id="mascotBox" aria-hidden="true"></div>
      <div id="sub">　</div>
    </div>
    <div id="bar"></div>
    <nav id="nav">
      <button id="prev">◀ 上一段</button>
      <button id="replay">🔁 再看一次</button>
      <button id="next">下一段 ▶</button>
    </nav>
  </section>
  <div id="note">語音使用瀏覽器內建中文朗讀（建議 Chrome、Edge、Safari）；沒有聲音時字幕仍會顯示。</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
